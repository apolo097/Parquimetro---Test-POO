<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parquímetro</title>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="styles.css">    
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="tittle">
        <h1>Parquímetro</h1>
        <p>
          Informe um valor e veremos quanto tempo seu veículo pode ficar
          conosco.
        </p>
      </div>

      <div class="tablePrice">
        <table>
          <tbody id="tabela-precos">
              <tr>
                <td>Valor</td>
                <td>Tempo</td>
              </tr>
          </tbody>
        </table>
        <p class="alert">** Tempo máximo de permanencia: <span id="tempo-maximo"> </span> minutos.</p>
      </div>

      <div class="parquimetro">

        <label for="valor"> Digite o valor:</label> <br>      

        <div class="input">
            <span>R$</span>
            <input type="text" id="valor" inputmode="decimal" placeholder="0,00" />            
        </div>

        <button class="btn" id="calcular">Calcular</button> 

        <p id="resultado"></p>
    </div>
  </body>
</html>
